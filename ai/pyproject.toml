[project]
name = "tracegreen-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.15.0",
    "fastapi==0.150.0",
    "pydantic==2.14.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
