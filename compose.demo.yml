# Demo stack (production images, no bind mounts):
#   docker compose -f compose.yml -f compose.demo.yml up --build
# Set PUBLIC_BASE_URL in .env.demo to http://<laptop-lan-ip>:3000 before the demo so QR codes point phones at this laptop.
services:
  migrate:
    build:
      context: ./api
      target: runtime
    command: ["--migrate", "--seed", "--exit"]
    env_file: .env.demo
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_URL: postgres://tracegreen:tracegreen@db:5432/tracegreen
      SEED_DIR: /seed
    volumes:
      - ./seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./api
      target: runtime
    env_file: .env.demo
    environment: !override
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DATABASE_URL: postgres://tracegreen:tracegreen@db:5432/tracegreen
      AI_BASE_URL: http://ai:8000
      AI_TIMEOUT_MS: "10000"
      SEED_DIR: /seed
    volumes: !override
      - ./seed:/seed:ro
    ports: !override []
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      ai:
        condition: service_healthy

  ai:
    build:
      context: ./ai
      target: runtime
    volumes: !override
      - ./seed:/seed:ro
    environment: !override
      SEED_DIR: /seed
      AI_MODEL: ${AI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_TIMEOUT_S: "10"

  web:
    build:
      context: ./web
      target: nginx
    volumes: !override []
    environment: !override {}
    ports: !override
      - "3000:80"
    depends_on: !override
      api:
        condition: service_healthy
