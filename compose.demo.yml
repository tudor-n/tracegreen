# Demo stack (production images, no bind mounts):
#   docker compose -f compose.yml -f compose.demo.yml up --build
# Set PUBLIC_BASE_URL in .env.demo to http://<laptop-lan-ip>:3000 before the demo so QR codes point phones at this laptop.
services:
  migrate:
    build:
      context: ./api
      target: runtime
    command: ["--migrate", "--seed", "--exit"]
    env_file: .env.demo
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_URL: postgres://tracegreen:tracegreen@db:5432/tracegreen
      SEED_DIR: /seed
    volumes:
      - ./seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./api
      target: runtime
    env_file: .env.demo
    environment: !override
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DATABASE_URL: postgres://tracegreen:tracegreen@db:5432/tracegreen
      # Unset or empty keeps Postgres; DATA_MODE=memory runs the demo image without the database (the fallback).
      DATA_MODE: ${DATA_MODE:-}
      AI_BASE_URL: http://ai:8000
      AI_TIMEOUT_MS: "10000"
      AI_CHAT_TIMEOUT_MS: ${AI_CHAT_TIMEOUT_MS:-20000}
      AI_EXTRACT_TIMEOUT_MS: ${AI_EXTRACT_TIMEOUT_MS:-25000}
      SEED_DIR: /seed
    volumes: !override
      - ./seed:/seed:ro
    ports: !override []
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      ai:
        condition: service_healthy

  ai:
    build:
      context: ./ai
      target: runtime
    volumes: !override
      - ./seed:/seed:ro
    # The same model variables as compose.yml, from the root .env; extra_hosts (Ollama on the host) comes from there too.
    # The scoring route stays off in the demo image.
    environment: !override
      SEED_DIR: /seed
      AI_MODELS: ${AI_MODELS:-}
      AI_MODEL: ${AI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-12288}
      OLLAMA_DISCOVER: ${OLLAMA_DISCOVER:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      AI_TIMEOUT_S: ${AI_TIMEOUT_S:-8}
      AI_MODEL_TIMEOUT_S: ${AI_MODEL_TIMEOUT_S:-4}
      OLLAMA_TIMEOUT_S: ${OLLAMA_TIMEOUT_S:-6}
      AI_CHAT_TIMEOUT_S: ${AI_CHAT_TIMEOUT_S:-15}
      AI_EXTRACT_TIMEOUT_S: ${AI_EXTRACT_TIMEOUT_S:-20}
      AI_LONG_MODEL_TIMEOUT_S: ${AI_LONG_MODEL_TIMEOUT_S:-12}
      AI_CHAT_MODELS: ${AI_CHAT_MODELS:-}
      AI_DEV_ROUTES: "0"

  web:
    build:
      context: ./web
      target: nginx
    volumes: !override []
    environment: !override {}
    ports: !override
      - "3000:80"
    depends_on: !override
      api:
        condition: service_healthy
