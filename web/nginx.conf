# Demo image: serves the SPA and proxies /api to the C# API so the browser (and the phone) use one origin.

# A supplier link carries its token in ?t= (the page and /api/verify/context). Log the path ($uri) and never the query
# string or the referrer, which the default format ($request, $http_referer) would write to the container log.
log_format tokenless '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log tokenless;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Server-Sent Events: never buffer, keep the connection open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 4m;
    }

    # The one API route with a token in its query string. An upstream failure (API restarting) makes nginx write the
    # whole request line to the error log, so this location keeps only critical errors.
    location = /api/verify/context {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /openapi/ {
        proxy_pass http://api:8080/openapi/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
